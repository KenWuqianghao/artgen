<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art or BS?</title>
<meta name="description" content="Photographs of art installations. Some are from real exhibitions. AI made the rest. Call BS and climb the ladder.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Art or BS?">
<meta property="og:title" content="Art or BS?">
<meta property="og:description" content="Some rooms are real art. AI made the rest. Can you call BS?">
<meta property="og:url" content="/">
<meta property="og:image" content="/share/card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/share/card.jpg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="game.css">
</head>
<body>
<header class="top">
  <div class="brand"><strong>Art or BS?</strong></div>
  <p class="tagline">Some rooms are real art. AI made the rest.</p>
  <div class="top-actions">
    <a class="btn ghost" href="studio">Open the Studio</a>
  </div>
</header>

<main class="game" id="game" data-state="loading">
  <p class="notice" id="notice" aria-live="polite">Hanging the photographs…</p>

  <section class="round" aria-label="The current set">
    <figure class="wall"><img id="photo" alt="Photograph of an art installation" width="1280" height="853"></figure>
    <div class="side">
      <div>
        <div class="progress">
          <span id="count"></span>
          <ol class="pips" id="pips" aria-hidden="true"></ol>
        </div>
        <p class="standing" id="standing"></p>
      </div>

      <div class="ask">
        <h1>Real art, or AI BS?</h1>
        <div class="choices">
          <button id="guess-real" class="choice" type="button"><span>Art</span><kbd>A</kbd></button>
          <button id="guess-ai" class="choice" type="button"><span>BS</span><kbd>B</kbd></button>
        </div>
        <p class="hint" id="round-error" role="alert"></p>
      </div>

      <div class="reveal" aria-live="polite">
        <p class="verdict" id="verdict"></p>
        <div id="label"></div>
        <p class="hint" id="crowd"></p>
        <button id="next" class="btn next" type="button"></button>
      </div>
    </div>
  </section>

  <section class="result" aria-label="Your set">
    <div class="score">
      <p class="kicker" id="set-name"></p>
      <h1 id="score"></h1>
      <p id="score-line"></p>
      <p class="done" id="done"></p>
      <button id="next-set" class="btn next" type="button">Next set</button>
      <p class="share-text" id="share-text"></p>
      <div class="row share">
        <button id="share" class="btn" type="button" hidden>Share</button>
        <a id="post" class="btn" target="_blank" rel="noopener">Post on X</a>
        <button id="copy" class="btn ghost" type="button">Copy result</button>
      </div>
    </div>

    <aside class="board">
      <form id="name-form" class="name-form">
        <label class="field grow"><span>Your name on the ladder</span>
          <input id="name" type="text" maxlength="20" autocomplete="nickname" spellcheck="false"></label>
        <button class="btn" type="submit">Save name</button>
      </form>
      <p class="hint" id="name-status" aria-live="polite"></p>
      <h2>The ladder</h2>
      <ol class="ranks" id="ranks"></ol>
    </aside>

    <div class="hang">
      <h2 id="hang-title"></h2>
      <ol class="works" id="works"></ol>
    </div>
  </section>
</main>
<script src="game.js"></script>
</body>
</html>
